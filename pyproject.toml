[project]
name = "fraud-scoring-engine"
version = "0.1.0"
description = "Fraud scoring engine for Databricks (Volumes + Delta / Unity Catalog)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "kagglehub>=1.0.1",
    "pandas>=2.2.0",
    "pyarrow>=18.0.0",
    "scikit-learn>=1.6.0",
    "xgboost>=3.2.0",
    "mlflow>=3.15.1",
    "optuna>=4.9.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.0",
    "pandas-stubs>=2.2.0",
    "pytest>=9.0.3",
    "scipy>=1.15.0",
    "seaborn>=0.13.0",
    "pyspark>=3.5.0,<4.1.0",
    "delta-spark>=3.2.0,<4.0.0",
]

[tool.pyright]
extraPaths = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "spark: tests that require a local SparkSession with Delta Lake",
]
